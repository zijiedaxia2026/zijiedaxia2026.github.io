<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紫介阁2026 · 个人主页</title>
<style>
  :root { --bg:#f6f8fa; --card:#ffffff; --text:#1f2328; --muted:#656d76; --accent:#0969da; --border:#d0d7de; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.65; }
  .wrap { max-width:720px; margin:0 auto; padding:56px 20px 64px; }
  header { text-align:center; margin-bottom:40px; }
  .avatar { width:96px; height:96px; border-radius:50%; background:linear-gradient(135deg,#0969da,#54aeff); display:flex; align-items:center; justify-content:center; color:#fff; font-size:38px; font-weight:700; margin:0 auto 16px; box-shadow:0 6px 20px rgba(9,105,218,.25); }
  h1 { font-size:28px; letter-spacing:.5px; }
  .sub { color:var(--muted); margin-top:8px; font-size:15px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; margin-bottom:20px; }
  h2 { font-size:18px; margin-bottom:12px; }
  p { color:var(--text); }
  .links a { color:var(--accent); text-decoration:none; font-weight:600; }
  .links a:hover { text-decoration:underline; }
  .btn { display:inline-block; background:var(--accent); color:#fff; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:600; margin-top:10px; transition:.2s; }
  .btn:hover { background:#0860ca; }
  footer { text-align:center; color:var(--muted); font-size:13px; margin-top:36px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="avatar">紫</div>
      <h1>紫介阁2026</h1>
      <div class="sub">GitHub：@zijiedaxia2026 · 热爱探索与创造的开发者</div>
    </header>
    <section class="card">
      <h2>关于我</h2>
      <p>这是我的第一个 GitHub Pages 个人主页。我正在学习 Git 与 GitHub 的协作流程，这里会逐步记录我的项目、笔记与成长轨迹。</p>
    </section>
    <section class="card">
      <h2>我的项目</h2>
      <p class="links">前往我的 GitHub 主页查看所有仓库：<a href="https://github.com/zijiedaxia2026">github.com/zijiedaxia2026</a></p>
      <a class="btn" href="https://github.com/zijiedaxia2026">访问 GitHub</a>
    </section>
    <footer>由 GitHub Pages 构建 · © 2026 紫介阁2026</footer>
  </div>
</body>
</html>
